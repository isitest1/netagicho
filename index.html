<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ネタ帳 - 話のネタとアイデアの記録</title>
  <meta name="description" content="思いついた瞬間を、ひとことで残し、必要なときに思い出せる。">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', sans-serif;
      background: #FAF9F7;
      color: #24211F;
      line-height: 1.7;
    }
    header {
      background: #E87835;
      color: white;
      padding: 60px 24px;
      text-align: center;
    }
    header h1 { font-size: 2.4rem; font-weight: 700; margin-bottom: 12px; }
    header p { font-size: 1.1rem; opacity: 0.9; max-width: 520px; margin: 0 auto; }
    .container { max-width: 760px; margin: 0 auto; padding: 60px 24px; }
    .tagline {
      text-align: center;
      font-size: 1.25rem;
      color: #716B67;
      margin-bottom: 48px;
    }
    .links {
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-block;
      padding: 14px 28px;
      border-radius: 50px;
      font-size: 1rem;
      font-weight: 600;
      text-decoration: none;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.85; }
    .btn-primary { background: #E87835; color: white; }
    .btn-secondary { background: white; color: #E87835; border: 2px solid #E87835; }
    footer {
      text-align: center;
      padding: 40px 24px;
      color: #716B67;
      font-size: 0.9rem;
      border-top: 1px solid #E9E5E1;
    }
  </style>
</head>
<body>
  <header>
    <h1>ネタ帳</h1>
    <p>話のネタとアイデアの記録</p>
  </header>
  <div class="container">
    <p class="tagline">思いついた瞬間を、ひとことで残し、必要なときに思い出せる。</p>
    <div class="links">
      <a href="support/" class="btn btn-primary">サポート・使い方</a>
      <a href="security/" class="btn btn-secondary">セキュリティポリシー</a>
    </div>
  </div>
  <footer>
    <p>&copy; 2026 Kohei Ishikawa. All rights reserved.</p>
  </footer>
</body>
</html>
